[project]
name = "when2meet-mcp"
version = "0.1.0"
description = "MCP server for when2meet scheduling polls"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
when2meet-mcp = "when2meet_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["when2meet_mcp"]
